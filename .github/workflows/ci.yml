name: Compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [0.2.1-rc.1, 0.2.1-rc.2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh }} --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm link:runtime
      - run: pnpm check
      - run: pnpm verify:package
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version)"
      - run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm link:runtime
      - run: pnpm build
      - run: pnpm verify:package
      - run: sha256sum *.tgz > SHA256SUMS
        working-directory: output
      - name: Upload versioned archives to GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" output/*.tgz output/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" output/*.tgz output/SHA256SUMS --verify-tag --generate-notes
          fi
